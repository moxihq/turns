[project]
name = "moxi-turns"
version = "0.1.0"
description = "Drive a coding-agent session's turns: start, hold, steer and read a turn on any harness."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "CodeManEthan", email = "codemanethan@gmail.com" }]
dependencies = ["moxi>=0.1,<0.2"]

[project.optional-dependencies]
codex = ["websockets>=17.0.1"]

[project.urls]
Homepage = "https://github.com/moxihq/turns"
Repository = "https://github.com/moxihq/turns"
Issues = "https://github.com/moxihq/turns/issues"

# Every Moxi distribution declares the umbrella, so a plain install puts `moxi` on PATH.
[project.scripts]
moxi = "moxi.cli:main"
# Internal entry points, spawned by the Claude runner or a Codex host, never typed (§5.10).
moxi-turns-endpoint = "moxi_turns.claude_endpoint:main"
moxi-turns-ping = "moxi_turns.codex_hooks:main"

# The module's one announcement, read by moxi.modules.
[project.entry-points."moxi.modules"]
turns = "moxi_turns.module"

[dependency-groups]
dev = ["pytest", "websockets>=17.0.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moxi_turns"]
# The Claude plugins' own tests run under `claude plugin test` from the checkout.
exclude = ["src/moxi_turns/claude/*/tests"]

[tool.hatch.build.targets.sdist]
# Paths that are never published stay out of a source distribution built from any branch.
exclude = ["/CLAUDE.md", "/.public-paths", "/.residue-allow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
